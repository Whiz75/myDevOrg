<template>
    <lightning-card class = "accounts-container" title="SELECT ACCOUNTS">

        <!-- next & refresh buttons to the next page and refresh the page-->
        <div class="slds-page-header__control">
            <ul class="slds-button-group-list">
                <li>
                    <button class="slds-button slds-button_neutral" onclick={handleRefresh}>
                        <lightning-icon icon-name="utility:refresh" size="xx-small" class="slds-button__icon slds-button__icon_left">
                        </lightning-icon>
                        Refresh
                    </button>
                </li>
                <li>
                    <button class="slds-button slds-button_neutral" onclick={handleNext}>
                        <lightning-icon icon-name="utility:chevronright" size="xx-small" class="slds-button__icon slds-button__icon_left">
                        </lightning-icon>
                        Next
                    </button>
                </li>
            </ul>
        </div>

        <!-- Loading spinner -->
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>

         <!-- Search Input for filtering accounts -->
         <div class="slds-p-around_small">
            <lightning-input
                id="search-input"
                value={searchKey}
                onchange={handleSearchChange}
                placeholder="Search this list"
                icon-name="utility:search"
                type="search">
            </lightning-input>
        </div>
        
        <template if:true={accounts.length}>
            <lightning-datatable
                key-field="Id"
                data={filteredAccounts}
                onrowselection={handleRowSelection}
                enable-infinite-loading="true"
                columns={columns}
                onsort={handleSort}
                sorted-by={sortedBy}
                sorted-direction={sortedDirection}
                is-loading={isInfiniteLoading}
                show-row-number-column>
            </lightning-datatable>

            <!-- Button to load more records -->
            <template if:true={hasMoreData}>
                <div class="slds-page-header__control">
                    <ul class="slds-button-group-list">
                        <li>
                            <button class="slds-button slds-button_neutral" onclick={handleLoadMore}>
                                <lightning-icon icon-name="utility:refresh" size="xx-small" class="slds-button__icon slds-button__icon_left">
                                </lightning-icon>
                                Load More
                            </button>
                        </li>
                    </ul>
                </div>
            </template>

            <div class="slds-m-top_medium">
                <p> Number of accounts selected : {selectedAccounts.length}</p>
            </div>
        </template>

        <!--Else dispaly this error-->
        <template if:false={accounts.length}>
            <div class="slds-text-color_error">
                An error occurred while loading the accounts
            </div>
        </template>
    </lightning-card>
</template>
